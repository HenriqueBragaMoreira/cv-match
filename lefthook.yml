pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm biome lint {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
      exclude: "**/.agents/**"

    - name: format
      run: pnpm biome format {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,css}"
      exclude: "**/.agents/**"

    - name: type-check
      run: pnpm turbo run type-check
